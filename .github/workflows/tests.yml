name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,visualization]

      - name: Lint with flake8
        run: |
          flake8 renoir --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 renoir --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: black --check --target-version py39 renoir tests

      - name: Type check with mypy
        run: mypy renoir

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=renoir --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Verify wheel contents
        run: |
          wheel=$(ls dist/*.whl | head -1)
          echo "Checking $wheel ..."
          python -m zipfile --list "$wheel" | grep -q "renoir/__init__.py" || { echo "ERROR: Missing renoir/__init__.py in wheel"; exit 1; }
          python -m zipfile --list "$wheel" | grep -q "renoir/py.typed" || echo "Warning: py.typed marker not found in wheel"
          python -m zipfile --list "$wheel" | grep -q "renoir/color/__init__.py" || { echo "ERROR: Missing color subpackage in wheel"; exit 1; }
          python -m zipfile --list "$wheel" | grep -q "renoir/logging.py" || echo "Warning: logging.py not found in wheel"
          echo "$wheel passes structural checks."

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Validate CITATION.cff
        run: |
          pip install cffconvert
          cffconvert --validate
