[build-system]
requires = ["setuptools>=61.0,<84.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renoir-wikiart"
version = "3.7.0"
description = "A pedagogical tool for analyzing artist-specific works from WikiArt with computational color theory and harmony analysis capabilities"
readme = "README.md"
authors = [
    {name = "Michail Semoglou", email = "m.semoglou@tongji.edu.cn"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Artistic Software",
]
keywords = ["art-history", "dataset-analysis", "digital-humanities", "education", "computational-design", "color-theory"]
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.0.0",
    "Pillow>=10.3.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["renoir*"]
exclude = ["tests*", "examples*", "Research*", "test_env*", "Pierre-Auguste Renoir*"]

[tool.setuptools.package-data]
renoir = ["data/colors/*.json", "py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=1.0",
    "jupyter>=1.0.0",
    "sphinx>=7.0",
    "furo>=2024.0",
    "sphinx-autodoc-typehints>=1.24",
]
visualization = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/MichailSemoglou/renoir"
Documentation = "https://renoir-wikiart.readthedocs.io"
Repository = "https://github.com/MichailSemoglou/renoir"
"Bug Tracker" = "https://github.com/MichailSemoglou/renoir/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring the WikiArt dataset (deselect with '-m \"not integration\"')",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["renoir"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
